name: Auto Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn flask onnxruntime

      - name: Smoke test (L0+L3)
        run: python scripts/auto_tester.py --smoke

      - name: Full no-AI test (L0-L5)
        run: python scripts/auto_tester.py --auto --no-ai

      - name: Pre-commit checks
        run: python scripts/pre_commit_check.py --all
