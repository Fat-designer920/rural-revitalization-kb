<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乡村振兴知识助手</title>
<link rel="stylesheet" href="/static/design_system.css">
<style>
.hero { text-align: center; padding: var(--space-2xl) 0; }
.hero h1 { font-size: 2rem; color: var(--color-primary); margin-bottom: var(--space-sm); }
.hero p { font-size: 1.1rem; color: var(--color-text-secondary); max-width: 500px; margin: 0 auto; }
.search-box { max-width: 650px; margin: var(--space-xl) auto; position: relative; }
.search-box textarea { min-height: 56px; padding-right: 100px; font-size: 1rem; border-radius: var(--radius-md); }
.search-box .btn { position: absolute; right: 8px; bottom: 8px; }
.answer-card { margin-top: var(--space-lg); display: none; }
.answer-card.visible { display: block; }
.answer-section { margin-bottom: var(--space-lg); }
.answer-section h3 { color: var(--color-text); margin-bottom: var(--space-sm); }
.evidence-item { padding: var(--space-sm); background: #f0f7f2; border-radius: var(--radius-sm); margin-bottom: var(--space-sm); font-size: 0.9rem; }
.loading { display: none; text-align: center; padding: var(--space-xl); }
.loading.visible { display: block; }
.stats-bar { display: flex; gap: var(--space-lg); justify-content: center; margin-top: var(--space-md); }
.stat-item { text-align: center; }
.stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); }
.stat-label { font-size: 0.8rem; color: var(--color-text-tertiary); }
.tier-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; margin-bottom: var(--space-lg); }
.tier-basic { background: #e6f4ea; color: var(--color-primary); }
.tier-pro { background: #fef3e0; color: var(--color-accent); }
.followup-chips { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-sm); }
.chip { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; background: var(--color-surface); border: 1px solid var(--color-border); transition: all var(--transition-fast); }
.chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">乡村振兴知识助手 <span class="badge badge-success" style="margin-left: 8px;">Beta</span></div>
  <div style="display:flex;gap:12px;align-items:center;">
    <span style="font-size:0.85rem;color:var(--color-text-secondary);">聚焦四川</span>
    <a href="/review.html" class="btn btn-outline btn-sm" style="font-size:0.8rem;">管理后台</a>
  </div>
</div>

<div class="container container-narrow">
  <div class="hero">
    <h1>乡村振兴,一问便知</h1>
    <p>四川乡村操盘手的随身知识库。政策怎么用、项目怎么推、坑在哪里——像旁边坐了个20年老师傅。</p>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-value" id="kpCount">--</div><div class="stat-label">知识点</div></div>
      <div class="stat-item"><div class="stat-value">15+</div><div class="stat-label">业务领域</div></div>
      <div class="stat-item"><div class="stat-value">四川</div><div class="stat-label">聚焦区域</div></div>
    </div>
  </div>

  <div class="search-box">
    <textarea class="input textarea" id="questionInput" placeholder="试试问: 我想搞全域土地综合整治,第一步做什么? 有什么红线?" rows="2"></textarea>
    <button class="btn btn-primary" id="askBtn" onclick="askQuestion()">提问</button>
  </div>

  <div class="loading" id="loading">
    <div class="skeleton" style="height:20px;width:80%;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:20px;width:60%;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:20px;width:70%;"></div>
    <p style="margin-top:12px;color:var(--color-text-tertiary);">AI正在分析...</p>
  </div>

  <div class="answer-card card" id="answerCard">
    <div class="answer-section">
      <h3>回答</h3>
      <p id="directAnswer" style="line-height:1.8;"></p>
    </div>
    <div class="answer-section" id="evidenceSection" style="display:none;">
      <h3>依据</h3>
      <div id="evidenceList"></div>
    </div>
    <div class="answer-section" id="followupSection" style="display:none;">
      <h3>你可能还想问</h3>
      <div class="followup-chips" id="followupChips"></div>
    </div>
    <div class="answer-section" id="coverageSection" style="display:none;">
      <h3 style="color:var(--color-warning);">坦诚告知</h3>
      <p id="coverageGap" style="font-size:0.9rem;"></p>
    </div>
    <div style="display:flex;gap:8px;margin-top:var(--space-md);padding-top:var(--space-md);border-top:1px solid var(--color-border);">
      <button class="btn btn-sm btn-outline" onclick="sendFeedback('helpful')">有帮助</button>
      <button class="btn btn-sm btn-outline" onclick="sendFeedback('not_helpful')">没帮助</button>
      <button class="btn btn-sm btn-outline" onclick="copyAnswer()">复制答案</button>
    </div>
  </div>
</div>

<div class="footer">乡村振兴知识助手 · 聚焦四川 · 服务操盘手 · Beta v2.3.7</div>

<script>
async function askQuestion() {
  var q = document.getElementById('questionInput').value.trim();
  if (!q) return;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('answerCard').classList.remove('visible');
  try {
    var resp = await fetch('/api/qa/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q, mode: 'friend'})
    });
    var data = await resp.json();
    renderAnswer(data);
  } catch(e) {
    document.getElementById('directAnswer').textContent = '抱歉,服务暂时不可用。请稍后再试。';
    document.getElementById('answerCard').classList.add('visible');
  }
  document.getElementById('loading').classList.remove('visible');
}

function renderAnswer(data) {
  var ans = data.answer_json || data;
  if (typeof ans === 'string') { try { ans = JSON.parse(ans); } catch(e) {} }
  document.getElementById('directAnswer').textContent = ans.direct_answer || ans.answer || '暂无回答';
  document.getElementById('answerCard').classList.add('visible');

  var evidenceList = document.getElementById('evidenceList');
  evidenceList.innerHTML = '';
  if (ans.evidence && ans.evidence.length > 0) {
    document.getElementById('evidenceSection').style.display = 'block';
    ans.evidence.forEach(function(e) {
      var div = document.createElement('div'); div.className = 'evidence-item';
      div.textContent = (e.title || '') + ': ' + (e.excerpt || '').substring(0, 200);
      evidenceList.appendChild(div);
    });
  }

  var chips = document.getElementById('followupChips');
  chips.innerHTML = '';
  if (ans.followup_questions && ans.followup_questions.length > 0) {
    document.getElementById('followupSection').style.display = 'block';
    ans.followup_questions.forEach(function(f) {
      var span = document.createElement('span'); span.className = 'chip';
      span.textContent = f.q || f; span.onclick = function() {
        document.getElementById('questionInput').value = f.q || f; askQuestion();
      };
      chips.appendChild(span);
    });
  }

  if (ans.coverage_gap) {
    document.getElementById('coverageSection').style.display = 'block';
    document.getElementById('coverageGap').textContent = ans.coverage_gap;
  }
}

function sendFeedback(type) {
  var q = document.getElementById('questionInput').value.trim();
  fetch('/api/qa/feedback', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: q, feedback_type: type})
  }).catch(function(){});
  var el = document.createElement('span'); el.className = 'badge badge-success';
  el.textContent = '感谢反馈!'; el.style.marginLeft = '8px';
  event.target.parentNode.appendChild(el);
}

function copyAnswer() {
  var text = document.getElementById('directAnswer').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var el = document.createElement('span'); el.className = 'badge badge-info';
    el.textContent = '已复制!'; el.style.marginLeft = '8px';
    event.target.parentNode.appendChild(el);
  });
}

fetch('/api/knowledge-points/stats').then(r=>r.json()).then(d=>{
  document.getElementById('kpCount').textContent = (d.total || 0).toLocaleString();
}).catch(function(){});
</script>
</body>
</html>
